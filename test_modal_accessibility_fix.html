<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Accessibility Fix Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }
        .test-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .test-button {
            margin: 10px;
        }
        .log-container {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 15px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        .log-entry {
            margin-bottom: 8px;
            padding: 5px;
            border-radius: 3px;
        }
        .log-info { background-color: #d1ecf1; }
        .log-success { background-color: #d4edda; }
        .log-warning { background-color: #fff3cd; }
        .log-error { background-color: #f8d7da; }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Modal Accessibility Fix Test</h1>
        <p>This test verifies that the modal accessibility fix resolves the aria-hidden focus issue.</p>
        
        <div class="mb-4">
            <button class="btn btn-primary test-button" data-bs-toggle="modal" data-bs-target="#jsonMatchModal">
                Open JSON Match Modal
            </button>
            <button class="btn btn-secondary test-button" data-bs-toggle="modal" data-bs-target="#jsonInventoryModal">
                Open JSON Inventory Modal
            </button>
        </div>
        
        <div class="log-container">
            <h5>Test Log:</h5>
            <div id="testLog"></div>
        </div>
    </div>

    <!-- JSON Match Modal -->
    <div class="modal fade" id="jsonMatchModal" tabindex="-1" aria-labelledby="jsonMatchModalLabel" inert>
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="jsonMatchModalLabel">JSON Product Matching</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close JSON match modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="jsonUrlInput" class="form-label">JSON URL:</label>
                        <input type="url" class="form-control" id="jsonUrlInput" 
                               placeholder="https://example.com/inventory-transfer.json" required>
                    </div>
                    <button type="button" class="btn btn-primary" onclick="testJsonMatch()">
                        Test Match Products
                    </button>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JSON Inventory Modal -->
    <div class="modal fade" id="jsonInventoryModal" tabindex="-1" aria-labelledby="jsonInventoryModalLabel" inert>
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="jsonInventoryModalLabel">JSON Inventory Slips</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close JSON inventory modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="jsonInventoryUrlInput" class="form-label">JSON URL:</label>
                        <input type="url" class="form-control" id="jsonInventoryUrlInput" 
                               placeholder="https://example.com/inventory-transfer.json" required>
                    </div>
                    <button type="button" class="btn btn-primary" onclick="testJsonInventory()">
                        Test Generate Inventory
                    </button>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Test logging function
        function addLog(message, type = 'info') {
            const logContainer = document.getElementById('testLog');
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            logEntry.innerHTML = `<strong>${new Date().toLocaleTimeString()}:</strong> ${message}`;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // Test functions
        function testJsonMatch() {
            addLog('JSON Match button clicked', 'success');
            addLog('This would normally trigger the JSON matching process', 'info');
        }

        function testJsonInventory() {
            addLog('JSON Inventory button clicked', 'success');
            addLog('This would normally trigger the inventory generation process', 'info');
        }

        // Accessibility fix for JSON Match Modal
        document.addEventListener('DOMContentLoaded', function() {
            addLog('DOM loaded, setting up accessibility fixes', 'info');
            
            const jsonMatchModal = document.getElementById('jsonMatchModal');
            if (jsonMatchModal) {
                addLog('Found JSON Match Modal, applying accessibility fixes', 'success');
                
                // Store the element that had focus before the modal opened
                let previouslyFocusedElement = null;
                
                // Handle modal show event
                jsonMatchModal.addEventListener('show.bs.modal', function() {
                    addLog('JSON Match Modal: show.bs.modal event fired', 'info');
                    
                    // Store the currently focused element
                    previouslyFocusedElement = document.activeElement;
                    addLog(`JSON Match Modal: Stored previously focused element: ${previouslyFocusedElement.tagName}`, 'info');
                    
                    // Ensure modal is properly accessible
                    jsonMatchModal.removeAttribute('aria-hidden');
                    jsonMatchModal.removeAttribute('inert');
                    jsonMatchModal.setAttribute('aria-modal', 'true');
                    addLog('JSON Match Modal: Removed aria-hidden and inert, set aria-modal=true', 'success');
                });
                
                // Handle modal shown event
                jsonMatchModal.addEventListener('shown.bs.modal', function() {
                    addLog('JSON Match Modal: shown.bs.modal event fired', 'info');
                    
                    // Focus the first focusable element in the modal
                    const firstFocusable = jsonMatchModal.querySelector('input, button, select, textarea, [tabindex]:not([tabindex="-1"])');
                    if (firstFocusable) {
                        firstFocusable.focus();
                        addLog(`JSON Match Modal: Focused first focusable element: ${firstFocusable.tagName}`, 'success');
                    } else {
                        addLog('JSON Match Modal: No focusable element found', 'warning');
                    }
                });
                
                // Handle modal hide event
                jsonMatchModal.addEventListener('hide.bs.modal', function() {
                    addLog('JSON Match Modal: hide.bs.modal event fired', 'info');
                    
                    // Move focus away from any focused element inside the modal
                    const focusedElement = jsonMatchModal.querySelector(':focus');
                    if (focusedElement) {
                        focusedElement.blur();
                        addLog(`JSON Match Modal: Blurred focused element: ${focusedElement.tagName}`, 'success');
                    } else {
                        addLog('JSON Match Modal: No focused element found to blur', 'info');
                    }
                });
                
                // Handle modal hidden event
                jsonMatchModal.addEventListener('hidden.bs.modal', function() {
                    addLog('JSON Match Modal: hidden.bs.modal event fired', 'info');
                    
                    // Set aria-hidden and inert after modal is fully hidden
                    jsonMatchModal.setAttribute('aria-hidden', 'true');
                    jsonMatchModal.setAttribute('inert', '');
                    jsonMatchModal.removeAttribute('aria-modal');
                    addLog('JSON Match Modal: Set aria-hidden=true and inert, removed aria-modal', 'success');
                    
                    // Restore focus to the previously focused element
                    if (previouslyFocusedElement && previouslyFocusedElement.focus) {
                        // Use setTimeout to ensure the modal is fully hidden before restoring focus
                        setTimeout(() => {
                            try {
                                previouslyFocusedElement.focus();
                                addLog(`JSON Match Modal: Restored focus to: ${previouslyFocusedElement.tagName}`, 'success');
                            } catch (e) {
                                // If the previously focused element is no longer available, focus the body
                                document.body.focus();
                                addLog('JSON Match Modal: Focused body (fallback)', 'warning');
                            }
                        }, 100);
                    } else {
                        addLog('JSON Match Modal: No previously focused element to restore', 'info');
                    }
                });
                
                // Handle close button clicks to ensure proper focus management
                const closeButtons = jsonMatchModal.querySelectorAll('[data-bs-dismiss="modal"]');
                closeButtons.forEach(button => {
                    button.addEventListener('click', function() {
                        addLog('JSON Match Modal: Close button clicked', 'info');
                        // Move focus away from the button before the modal starts hiding
                        setTimeout(() => {
                            this.blur();
                            addLog('JSON Match Modal: Blurred close button', 'success');
                        }, 0);
                    });
                });
            } else {
                addLog('JSON Match Modal not found', 'error');
            }
            
            // Also fix the JSON Inventory Modal
            const jsonInventoryModal = document.getElementById('jsonInventoryModal');
            if (jsonInventoryModal) {
                addLog('Found JSON Inventory Modal, applying accessibility fixes', 'success');
                
                // Store the element that had focus before the modal opened
                let previouslyFocusedElement = null;
                
                // Handle modal show event
                jsonInventoryModal.addEventListener('show.bs.modal', function() {
                    addLog('JSON Inventory Modal: show.bs.modal event fired', 'info');
                    
                    // Store the currently focused element
                    previouslyFocusedElement = document.activeElement;
                    addLog(`JSON Inventory Modal: Stored previously focused element: ${previouslyFocusedElement.tagName}`, 'info');
                    
                    // Ensure modal is properly accessible
                    jsonInventoryModal.removeAttribute('aria-hidden');
                    jsonInventoryModal.removeAttribute('inert');
                    jsonInventoryModal.setAttribute('aria-modal', 'true');
                    addLog('JSON Inventory Modal: Removed aria-hidden and inert, set aria-modal=true', 'success');
                });
                
                // Handle modal shown event
                jsonInventoryModal.addEventListener('shown.bs.modal', function() {
                    addLog('JSON Inventory Modal: shown.bs.modal event fired', 'info');
                    
                    // Focus the first focusable element in the modal
                    const firstFocusable = jsonInventoryModal.querySelector('input, button, select, textarea, [tabindex]:not([tabindex="-1"])');
                    if (firstFocusable) {
                        firstFocusable.focus();
                        addLog(`JSON Inventory Modal: Focused first focusable element: ${firstFocusable.tagName}`, 'success');
                    } else {
                        addLog('JSON Inventory Modal: No focusable element found', 'warning');
                    }
                });
                
                // Handle modal hide event
                jsonInventoryModal.addEventListener('hide.bs.modal', function() {
                    addLog('JSON Inventory Modal: hide.bs.modal event fired', 'info');
                    
                    // Move focus away from any focused element inside the modal
                    const focusedElement = jsonInventoryModal.querySelector(':focus');
                    if (focusedElement) {
                        focusedElement.blur();
                        addLog(`JSON Inventory Modal: Blurred focused element: ${focusedElement.tagName}`, 'success');
                    } else {
                        addLog('JSON Inventory Modal: No focused element found to blur', 'info');
                    }
                });
                
                // Handle modal hidden event
                jsonInventoryModal.addEventListener('hidden.bs.modal', function() {
                    addLog('JSON Inventory Modal: hidden.bs.modal event fired', 'info');
                    
                    // Set aria-hidden and inert after modal is fully hidden
                    jsonInventoryModal.setAttribute('aria-hidden', 'true');
                    jsonInventoryModal.setAttribute('inert', '');
                    jsonInventoryModal.removeAttribute('aria-modal');
                    addLog('JSON Inventory Modal: Set aria-hidden=true and inert, removed aria-modal', 'success');
                    
                    // Restore focus to the previously focused element
                    if (previouslyFocusedElement && previouslyFocusedElement.focus) {
                        // Use setTimeout to ensure the modal is fully hidden before restoring focus
                        setTimeout(() => {
                            try {
                                previouslyFocusedElement.focus();
                                addLog(`JSON Inventory Modal: Restored focus to: ${previouslyFocusedElement.tagName}`, 'success');
                            } catch (e) {
                                // If the previously focused element is no longer available, focus the body
                                document.body.focus();
                                addLog('JSON Inventory Modal: Focused body (fallback)', 'warning');
                            }
                        }, 100);
                    } else {
                        addLog('JSON Inventory Modal: No previously focused element to restore', 'info');
                    }
                });
                
                // Handle close button clicks to ensure proper focus management
                const closeButtons = jsonInventoryModal.querySelectorAll('[data-bs-dismiss="modal"]');
                closeButtons.forEach(button => {
                    button.addEventListener('click', function() {
                        addLog('JSON Inventory Modal: Close button clicked', 'info');
                        // Move focus away from the button before the modal starts hiding
                        setTimeout(() => {
                            this.blur();
                            addLog('JSON Inventory Modal: Blurred close button', 'success');
                        }, 0);
                    });
                });
            } else {
                addLog('JSON Inventory Modal not found', 'error');
            }
            
            addLog('Accessibility fixes setup complete', 'success');
        });

        // Test focus management
        document.addEventListener('focusin', function(e) {
            const modal = e.target.closest('.modal');
            if (modal) {
                addLog(`Focus moved to element inside ${modal.id}: ${e.target.tagName}`, 'info');
            }
        });

        document.addEventListener('focusout', function(e) {
            const modal = e.target.closest('.modal');
            if (modal) {
                addLog(`Focus left element inside ${modal.id}: ${e.target.tagName}`, 'info');
            }
        });
    </script>
</body>
</html>
