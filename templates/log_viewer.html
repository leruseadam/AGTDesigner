<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Log Viewer</title>
    <style>
        body {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            background-color: #1e1e1e;
            color: #d4d4d4;
            margin: 0;
            padding: 20px;
            line-height: 1.4;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: #2d2d30;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #3e3e42;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        label {
            font-size: 12px;
            color: #9ca3af;
            font-weight: bold;
        }
        
        select, input, button {
            background: #3c3c3c;
            border: 1px solid #555;
            color: #d4d4d4;
            padding: 8px 12px;
            border-radius: 4px;
            font-family: inherit;
        }
        
        button {
            background: #0d7377;
            border-color: #14a085;
            cursor: pointer;
            font-weight: bold;
        }
        
        button:hover {
            background: #14a085;
        }
        
        .log-container {
            background: #1e1e1e;
            border: 1px solid #3e3e42;
            border-radius: 8px;
            padding: 20px;
            max-height: 70vh;
            overflow-y: auto;
            font-size: 13px;
        }
        
        .log-entry {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 4px;
            border-left: 4px solid transparent;
        }
        
        .log-entry.error {
            background: #2d1b1b;
            border-left-color: #f56565;
        }
        
        .log-entry.warning {
            background: #2d2a1b;
            border-left-color: #f6ad55;
        }
        
        .log-entry.info {
            background: #1b2d1b;
            border-left-color: #68d391;
        }
        
        .log-entry.debug {
            background: #1b2d2d;
            border-left-color: #4fd1c7;
        }
        
        .log-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
        }
        
        .log-level {
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
        }
        
        .log-level.error {
            background: #f56565;
            color: white;
        }
        
        .log-level.warning {
            background: #f6ad55;
            color: white;
        }
        
        .log-level.info {
            background: #68d391;
            color: white;
        }
        
        .log-level.debug {
            background: #4fd1c7;
            color: white;
        }
        
        .log-timestamp {
            color: #9ca3af;
            font-size: 11px;
        }
        
        .log-name {
            color: #60a5fa;
            font-weight: bold;
        }
        
        .log-location {
            color: #fbbf24;
            font-size: 11px;
            margin-top: 3px;
        }
        
        .log-message {
            margin-top: 5px;
            color: #d4d4d4;
        }
        
        .log-context {
            margin-top: 5px;
            color: #9ca3af;
            font-size: 11px;
            font-style: italic;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: #2d2d30;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid #3e3e42;
        }
        
        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #60a5fa;
        }
        
        .stat-label {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 5px;
        }
        
        .loading {
            text-align: center;
            color: #9ca3af;
            padding: 20px;
        }
        
        .no-logs {
            text-align: center;
            color: #9ca3af;
            padding: 40px;
            font-style: italic;
        }
        
        .refresh-btn {
            background: #7c3aed;
            border-color: #8b5cf6;
        }
        
        .refresh-btn:hover {
            background: #8b5cf6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Enhanced Log Viewer</h1>
            <p>Real-time log monitoring and analysis for Label Maker</p>
        </div>
        
        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-number" id="total-logs">-</div>
                <div class="stat-label">Total Logs</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="error-count">-</div>
                <div class="stat-label">Errors</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="warning-count">-</div>
                <div class="stat-label">Warnings</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="info-count">-</div>
                <div class="stat-label">Info</div>
            </div>
        </div>
        
        <div class="controls">
            <div class="control-group">
                <label>Time Range</label>
                <select id="timeRange">
                    <option value="1">Last Hour</option>
                    <option value="6">Last 6 Hours</option>
                    <option value="24" selected>Last 24 Hours</option>
                    <option value="168">Last Week</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>Log Level</label>
                <select id="logLevel">
                    <option value="">All Levels</option>
                    <option value="ERROR">Errors Only</option>
                    <option value="WARNING">Warnings Only</option>
                    <option value="INFO">Info Only</option>
                    <option value="DEBUG">Debug Only</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>Search</label>
                <input type="text" id="searchTerm" placeholder="Search logs...">
            </div>
            
            <div class="control-group">
                <label>&nbsp;</label>
                <button onclick="loadLogs()">🔍 Filter</button>
            </div>
            
            <div class="control-group">
                <label>&nbsp;</label>
                <button class="refresh-btn" onclick="loadLogs()">🔄 Refresh</button>
            </div>
        </div>
        
        <div class="log-container" id="logContainer">
            <div class="loading">Loading logs...</div>
        </div>
    </div>

    <script>
        let autoRefresh = true;
        let refreshInterval;
        
        function formatLogEntry(entry) {
            const levelClass = entry.level.toLowerCase();
            const timestamp = new Date(entry.timestamp).toLocaleString();
            
            let locationHtml = '';
            if (entry.filename && entry.filename !== 'unknown') {
                locationHtml = `<div class="log-location">📍 ${entry.filename}:${entry.line} in ${entry.function}()</div>`;
            }
            
            let contextHtml = '';
            if (entry.context) {
                const contextStr = Object.entries(entry.context)
                    .map(([k, v]) => `${k}=${v}`)
                    .join(' | ');
                contextHtml = `<div class="log-context">Context: ${contextStr}</div>`;
            }
            
            return `
                <div class="log-entry ${levelClass}">
                    <div class="log-header">
                        <span class="log-level ${levelClass}">${entry.level}</span>
                        <span class="log-timestamp">${timestamp}</span>
                        <span class="log-name">${entry.name}</span>
                    </div>
                    ${locationHtml}
                    <div class="log-message">${entry.message}</div>
                    ${contextHtml}
                </div>
            `;
        }
        
        function updateStats(logs) {
            const stats = {
                total: logs.length,
                error: logs.filter(l => l.level === 'ERROR').length,
                warning: logs.filter(l => l.level === 'WARNING').length,
                info: logs.filter(l => l.level === 'INFO').length,
                debug: logs.filter(l => l.level === 'DEBUG').length
            };
            
            document.getElementById('total-logs').textContent = stats.total;
            document.getElementById('error-count').textContent = stats.error;
            document.getElementById('warning-count').textContent = stats.warning;
            document.getElementById('info-count').textContent = stats.info;
        }
        
        function loadLogs() {
            const timeRange = document.getElementById('timeRange').value;
            const logLevel = document.getElementById('logLevel').value;
            const searchTerm = document.getElementById('searchTerm').value;
            
            const params = new URLSearchParams({
                hours: timeRange,
                level: logLevel,
                search: searchTerm
            });
            
            fetch(`/api/logs?${params}`)
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById('logContainer');
                    
                    if (data.logs && data.logs.length > 0) {
                        container.innerHTML = data.logs.map(formatLogEntry).join('');
                        updateStats(data.logs);
                    } else {
                        container.innerHTML = '<div class="no-logs">No logs found matching your criteria</div>';
                        updateStats([]);
                    }
                })
                .catch(error => {
                    document.getElementById('logContainer').innerHTML = 
                        `<div class="no-logs">Error loading logs: ${error.message}</div>`;
                });
        }
        
        function startAutoRefresh() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
            
            refreshInterval = setInterval(() => {
                if (autoRefresh) {
                    loadLogs();
                }
            }, 5000); // Refresh every 5 seconds
        }
        
        function stopAutoRefresh() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
                refreshInterval = null;
            }
        }
        
        // Event listeners
        document.getElementById('timeRange').addEventListener('change', loadLogs);
        document.getElementById('logLevel').addEventListener('change', loadLogs);
        document.getElementById('searchTerm').addEventListener('input', 
            debounce(loadLogs, 500));
        
        // Debounce function
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadLogs();
            startAutoRefresh();
        });
        
        // Handle visibility change to pause/resume auto-refresh
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopAutoRefresh();
            } else {
                startAutoRefresh();
            }
        });
    </script>
</body>
</html>
