<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generating Labels - AGT Label Maker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            width: 600px;
            padding: 60px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            text-align: center;
        }
        
        .app-title {
            font-size: 48px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        
        .app-subtitle {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 40px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .progress-section {
            margin-bottom: 25px;
        }
        
        .progress-label {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4F46E5, #7C3AED);
            border-radius: 2px;
            transition: width 0.3s ease;
            width: 0%;
        }
        
        .loading-message {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.8);
            min-height: 28px;
        }
        
        .template-info {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .copyright {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 35px;
            font-weight: 400;
        }
        
        .spinner {
            width: 56px;
            height: 56px;
            margin: 0 auto 30px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #4F46E5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .exit-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.6);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .exit-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        
        <h1 class="app-title">AGT DESIGNER</h1>
        <p class="app-subtitle">Generating Labels</p>
        
        <div class="progress-section">
            <div class="progress-label">Processing</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress"></div>
            </div>
            <div class="loading-message" id="message">Initializing...</div>
        </div>
        
        <div class="template-info" id="templateInfo"></div>
        
        <div class="copyright">©2025 Adam Cordova for A Greener T</div>
        
        <button class="exit-btn" onclick="window.close() || history.back()">✕ Exit</button>
    </div>
    
    <script>
        const progressFill = document.getElementById('progress');
        const message = document.getElementById('message');
        const templateInfo = document.getElementById('templateInfo');
        
        const messages = [
            'Loading templates...',
            'Preparing data...',
            'Generating labels...',
            'Finalizing output...'
        ];
        
        let msgIndex = 0;
        let progress = 0;
        
        // Update message every 2 seconds
        setInterval(() => {
            msgIndex = (msgIndex + 1) % messages.length;
            message.textContent = messages[msgIndex];
        }, 2000);
        
        // Simulate progress
        function updateProgress() {
            progress += Math.random() * 12 + 3;
            if (progress > 95) progress = 95; // Don't complete until actually done
            progressFill.style.width = progress + '%';
            if (progress < 95) {
                setTimeout(updateProgress, 300 + Math.random() * 700);
            }
        }
        
        setTimeout(updateProgress, 500);
        
        // Get template info from URL or parent
        const urlParams = new URLSearchParams(window.location.search);
        const template = urlParams.get('template') || 'STANDARD';
        templateInfo.textContent = `Template: ${template}`;
    </script>
</body>
</html>
