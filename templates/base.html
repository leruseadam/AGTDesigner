<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AGT Designer: Auto-Generating Tag Designer{% endblock %}</title>

    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="alternate icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="shortcut icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}?v={{ cache_bust if cache_bust else '1.0' }}">
        <!-- Inline override to force updated tag header visibility (cache-bust safe) -->
        <style>
            /* Immediate/inline override for tag list headers to ensure visible changes appear despite cached CSS */
            .tag-list .group-header,
            .tag-list .category-header,
            .tag-list .tag-group-label {
                font-size: 1.05em !important;
                font-weight: 700 !important;
                color: #ffffff !important;
                padding-left: 8px !important;
            }
        </style>
        <!-- Emergency visibility override to restore tag list rendering -->
        <style>
            /* Ensure containers are visible and can scroll */
            #availableTags, #selectedTags {
                display: block !important;
                height: calc(100vh - 220px) !important;
                min-height: 28rem !important;
                max-height: none !important;
                overflow-y: auto !important;
                visibility: visible !important;
            }

            /* Make each tag entry visible and ensure it participates in layout */
            #availableTags .tag-entry, #availableTags .tag-item, #availableTags .tag-row,
            #selectedTags .tag-entry, #selectedTags .tag-item, #selectedTags .tag-row {
                display: block !important;
                visibility: visible !important;
                opacity: 1 !important;
                color: #ffffff !important;
                background: transparent !important;
                height: auto !important;
                flex: 0 0 auto !important;
                padding: 0.5rem 0.75rem !important;
            }

            /* Ensure checkboxes and labels show on top */
            #availableTags .tag-checkbox, #availableTags .form-check-label,
            #selectedTags .tag-checkbox, #selectedTags .form-check-label {
                display: inline-block !important;
                visibility: visible !important;
                color: #ffffff !important;
            }
        </style>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    
    <!-- Font Awesome for additional icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    {% block head %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/enhanced-ui.js') }}"></script>
    <script src="{{ url_for('static', filename='js/generation-splash.js') }}"></script>
    <script src="{{ url_for('static', filename='js/drag-and-drop-manager.js') }}"></script>
    <script src="{{ url_for('static', filename='js/database-sync.js') }}"></script>
    <script src="{{ url_for('static', filename='js/unified-font-sizing.js') }}"></script>
    <script src="{{ url_for('static', filename='js/fast_upload_frontend.js') }}"></script>
    <script src="{{ url_for('static', filename='js/lightning_upload.js') }}"></script>
    <script src="{{ url_for('static', filename='js/turbo_upload.js') }}"></script>
    <script src="{{ url_for('static', filename='js/custom_plan_upload.js') }}"></script>
    <script src="{{ url_for('static', filename='js/fast_generation.js') }}"></script>
    {% block scripts %}{% endblock %}
    {% include 'lineage_editor.html' %}
    <script src="{{ url_for('static', filename='js/lineage-editor.js') }}"></script>
    
    <!-- Generation Splash Modal Overlay -->
    <div id="generationSplashModal" class="generation-splash-modal" style="display:none;">
        <div class="generation-splash-backdrop"></div>
    </div>
        <!-- Force stronger tag header styles at end of body to override inline/page styles -->
        <style>
            /* Lower-level tag headers and check labels inside tag lists */
            .tag-list .form-check-label {
                font-size: 1rem !important;
                font-weight: 700 !important;
                color: #ffffff !important;
                letter-spacing: 0.02em !important;
            }

            .tag-group-header {
                font-size: 1.18em !important;
                font-weight: 700 !important;
            }

            /* Slightly larger for the nested group headers (weights/price) */
            .tag-list .group-header, .tag-list .category-header, .tag-list .tag-group-label {
                font-size: 1.1em !important;
                font-weight: 700 !important;
                color: #ffffff !important;
            }
        </style>
        <!-- Immediate strong override to ensure tag lists are taller (cache-proof) -->
        <style>
            /* Force taller tag-list containers for troubleshooting and to override cached CSS */
            #availableTags, #selectedTags {
                min-height: 28rem !important;
                max-height: none !important;
                height: auto !important;
            }
        </style>
</body>
</html>

<script>
    // Diagnostic logging (non-intrusive) to help locate missing tags issue
    window.addEventListener('load', () => {
        try {
            const avail = document.getElementById('availableTags');
            const selected = document.getElementById('selectedTags');
            console.log('DIAG: #availableTags present?', !!avail);
            if (avail) {
                console.log('DIAG: #availableTags children count =', avail.children.length);
                console.log('DIAG: #availableTags computed height =', window.getComputedStyle(avail).height);
            }
            if (selected) {
                console.log('DIAG: #selectedTags children count =', selected.children.length);
                console.log('DIAG: #selectedTags computed height =', window.getComputedStyle(selected).height);
            }
            const glass = document.querySelector('.glass-card');
            if (glass) console.log('DIAG: .glass-card computed height =', window.getComputedStyle(glass).height);
            console.log('DIAG: storeConfirmed variable present?', !!window.storeConfirmed, 'sessionStorage.selected_store=', sessionStorage.getItem('selected_store'));
        } catch (e) { console.warn('DIAG: logging failed', e); }
    });
</script>
