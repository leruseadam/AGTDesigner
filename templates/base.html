<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AGT Designer: Auto-Generating Tag Designer{% endblock %}</title>

    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="alternate icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="shortcut icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}?v={{ cache_bust if cache_bust else '1.0' }}">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    
    <!-- Font Awesome for additional icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    {% block head %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/enhanced-ui.js') }}"></script>
    <script src="{{ url_for('static', filename='js/generation-splash.js') }}"></script>
    <script src="{{ url_for('static', filename='js/drag-and-drop-manager.js') }}"></script>
    <script src="{{ url_for('static', filename='js/database-sync.js') }}"></script>
    <script src="{{ url_for('static', filename='js/unified-font-sizing.js') }}"></script>
    <script src="{{ url_for('static', filename='js/fast_upload_frontend.js') }}"></script>
    <script src="{{ url_for('static', filename='js/lightning_upload.js') }}"></script>
    <script src="{{ url_for('static', filename='js/turbo_upload.js') }}"></script>
    <script src="{{ url_for('static', filename='js/custom_plan_upload.js') }}"></script>
    <script src="{{ url_for('static', filename='js/fast_generation.js') }}"></script>
    {% block scripts %}{% endblock %}
    {% include 'lineage_editor.html' %}
    <script src="{{ url_for('static', filename='js/lineage-editor.js') }}"></script>
    
    <!-- Generation Splash Modal Overlay -->
    <div id="generationSplashModal" class="generation-splash-modal" style="display:none;">
        <div class="generation-splash-backdrop"></div>
    </div>

    <!-- Session Timeout Warning Modal -->
    <div id="sessionTimeoutModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:9999; justify-content:center; align-items:center;">
        <div style="background:#fff; border-radius:12px; padding:32px; max-width:420px; text-align:center; box-shadow:0 8px 32px rgba(0,0,0,0.3);">
            <div style="font-size:48px; margin-bottom:16px;">&#9888;</div>
            <h3 style="margin:0 0 12px; color:#333; font-size:1.4rem;">Session Timeout</h3>
            <p style="margin:0 0 24px; color:#666; font-size:1rem; line-height:1.5;">
                This page has been open for over 2 hours. Please refresh to ensure data accuracy and prevent potential issues.
            </p>
            <button id="sessionTimeoutRefreshBtn" style="background:#007bff; color:#fff; border:none; padding:12px 32px; border-radius:6px; font-size:1rem; cursor:pointer; transition:background 0.2s;">
                Refresh Now
            </button>
        </div>
    </div>

    <script>
    (function() {
        var SESSION_TIMEOUT_MS = 2 * 60 * 60 * 1000; // 2 hours
        var pageLoadTime = Date.now();
        var timeoutTriggered = false;

        function showTimeoutWarning() {
            if (timeoutTriggered) return;
            timeoutTriggered = true;

            var modal = document.getElementById('sessionTimeoutModal');
            if (modal) {
                modal.style.display = 'flex';
            }
            console.warn('Session timeout: Page has been open for over 2 hours. Refresh required.');
        }

        // Set timeout for 2 hours
        setTimeout(showTimeoutWarning, SESSION_TIMEOUT_MS);

        // Handle refresh button click
        document.addEventListener('DOMContentLoaded', function() {
            var refreshBtn = document.getElementById('sessionTimeoutRefreshBtn');
            if (refreshBtn) {
                refreshBtn.addEventListener('click', function() {
                    window.location.reload();
                });
            }
        });

        // Also check on visibility change (in case tab was in background)
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden && !timeoutTriggered) {
                var elapsed = Date.now() - pageLoadTime;
                if (elapsed >= SESSION_TIMEOUT_MS) {
                    showTimeoutWarning();
                }
            }
        });
    })();
    </script>
</body>
</html>
