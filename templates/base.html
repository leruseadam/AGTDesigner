<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AGT Designer: Auto-Generating Tag Designer{% endblock %}</title>

    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="alternate icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="shortcut icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}?v={{ cache_bust if cache_bust else '1.0' }}">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    
    <!-- Font Awesome for additional icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    {% block head %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/enhanced-ui.js') }}"></script>
    <script src="{{ url_for('static', filename='js/generation-splash.js') }}"></script>
    <script src="{{ url_for('static', filename='js/drag-and-drop-manager.js') }}"></script>
    <script src="{{ url_for('static', filename='js/database-sync.js') }}"></script>
    <script src="{{ url_for('static', filename='js/unified-font-sizing.js') }}"></script>
    <script src="{{ url_for('static', filename='js/fast_upload_frontend.js') }}"></script>
    <script src="{{ url_for('static', filename='js/lightning_upload.js') }}"></script>
    <script src="{{ url_for('static', filename='js/turbo_upload.js') }}"></script>
    <script src="{{ url_for('static', filename='js/custom_plan_upload.js') }}"></script>
    <script src="{{ url_for('static', filename='js/fast_generation.js') }}"></script>
    {% block scripts %}{% endblock %}
    {% include 'lineage_editor.html' %}
    <script src="{{ url_for('static', filename='js/lineage-editor.js') }}"></script>
    
    <!-- Generation Splash Modal Overlay -->
    <div id="generationSplashModal" class="generation-splash-modal" style="display:none;">
        <div class="generation-splash-backdrop"></div>
    </div>
</body>
</html>
