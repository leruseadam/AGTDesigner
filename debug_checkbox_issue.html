<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox Debug Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f0f0f0;
        }
        .test-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .checkbox-test {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .tag-checkbox {
            margin-right: 8px;
        }
        .debug-output {
            background: #f8f8f8;
            border: 1px solid #ddd;
            padding: 10px;
            margin-top: 10px;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>Checkbox Click Debug Test</h1>
    
    <div class="test-container">
        <h3>Test 1: Basic Checkbox</h3>
        <div class="checkbox-test">
            <input type="checkbox" id="test1" class="tag-checkbox" value="Test Product 1">
            <label for="test1">Test Product 1</label>
        </div>
    </div>
    
    <div class="test-container">
        <h3>Test 2: Checkbox with Event Listeners</h3>
        <div class="checkbox-test">
            <input type="checkbox" id="test2" class="tag-checkbox" value="Test Product 2">
            <label for="test2">Test Product 2</label>
        </div>
    </div>
    
    <div class="test-container">
        <h3>Test 3: Checkbox with Click Handler</h3>
        <div class="checkbox-test">
            <input type="checkbox" id="test3" class="tag-checkbox" value="Test Product 3">
            <label for="test3">Test Product 3</label>
        </div>
    </div>
    
    <div class="test-container">
        <h3>Debug Output</h3>
        <div id="debugOutput" class="debug-output"></div>
    </div>

    <script>
        function log(message) {
            const output = document.getElementById('debugOutput');
            const timestamp = new Date().toLocaleTimeString();
            output.textContent += `[${timestamp}] ${message}\n`;
            console.log(message);
        }

        // Test 1: Basic checkbox
        document.getElementById('test1').addEventListener('change', function(e) {
            log(`Test 1 - Change event: checked=${e.target.checked}, value=${e.target.value}`);
        });

        // Test 2: Checkbox with multiple event listeners
        const test2 = document.getElementById('test2');
        test2.addEventListener('change', function(e) {
            log(`Test 2 - Change event: checked=${e.target.checked}, value=${e.target.value}`);
        });
        test2.addEventListener('click', function(e) {
            log(`Test 2 - Click event: checked=${e.target.checked}, value=${e.target.value}`);
        });

        // Test 3: Checkbox with click handler
        const test3 = document.getElementById('test3');
        test3.addEventListener('change', function(e) {
            log(`Test 3 - Change event: checked=${e.target.checked}, value=${e.target.value}`);
        });
        test3.addEventListener('click', function(e) {
            log(`Test 3 - Click event: checked=${e.target.checked}, value=${e.target.value}`);
        });
        test3.addEventListener('mousedown', function(e) {
            log(`Test 3 - MouseDown event: checked=${e.target.checked}, value=${e.target.value}`);
        });

        // Add global event listeners to detect any interference
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('tag-checkbox')) {
                log(`Global click detected on checkbox: ${e.target.value}`);
            }
        }, true);

        document.addEventListener('change', function(e) {
            if (e.target.classList.contains('tag-checkbox')) {
                log(`Global change detected on checkbox: ${e.target.value}`);
            }
        }, true);

        log('Debug test initialized. Click on the checkboxes above to test functionality.');
    </script>
</body>
</html>
