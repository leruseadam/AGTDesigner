<!DOCTYPE html>
<html>
<head>
    <title>Simple Lineage Editor Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2>Simple Lineage Editor Test</h2>
        <button class="btn btn-primary" onclick="testLineageEditor()">Test Lineage Editor</button>
        <div id="output" class="mt-3"></div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/lineage-editor.js"></script>
    
    <script>
        function log(message) {
            const output = document.getElementById('output');
            output.innerHTML += '<div>' + new Date().toLocaleTimeString() + ': ' + message + '</div>';
            console.log(message);
        }
        
        function testLineageEditor() {
            log('Starting lineage editor test...');
            
            // Check if StrainLineageEditor is available
            if (typeof StrainLineageEditor === 'undefined') {
                log('ERROR: StrainLineageEditor class not found');
                return;
            }
            
            log('StrainLineageEditor class found');
            
            // Initialize the editor
            try {
                window.strainLineageEditor = new StrainLineageEditor();
                window.strainLineageEditor.init();
                log('StrainLineageEditor initialized');
            } catch (error) {
                log('ERROR initializing: ' + error.message);
                return;
            }
            
            // Wait a moment then try to open
            setTimeout(() => {
                try {
                    log('Attempting to open editor...');
                    window.strainLineageEditor.openEditor('Test Strain', 'HYBRID');
                    log('openEditor called successfully');
                } catch (error) {
                    log('ERROR opening editor: ' + error.message);
                }
            }, 500);
        }
        
        // Log when page loads
        document.addEventListener('DOMContentLoaded', function() {
            log('Page loaded');
        });
    </script>
</body>
</html>
