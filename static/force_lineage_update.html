<!DOCTYPE html>
<html>
<head><title>Force Lineage Update</title></head>
<body>
<h1>Force Update Lineage Dropdown</h1>
<button onclick="forceUpdate()">Click to Force Update</button>
<pre id="result"></pre>

<script>
async function forceUpdate() {
    const result = document.getElementById('result');
    result.textContent = 'Fetching lineages...';

    try {
        // Get lineages from API
        const resp = await fetch('/api/filter-options?refresh=true&nocache=1&t=' + Date.now());
        const data = await resp.json();
        const lineages = data.lineage || [];

        result.textContent = `API returned ${lineages.length} lineages:\n` + JSON.stringify(lineages, null, 2);

        // Open main app in new window and inject update
        const win = window.open('/', '_blank');

        setTimeout(() => {
            try {
                const lineageFilter = win.document.getElementById('lineageFilter');
                if (!lineageFilter) {
                    result.textContent += '\n\nERROR: lineageFilter element not found in main app';
                    return;
                }

                // Clear existing options
                lineageFilter.innerHTML = '';

                // Add "All" option
                const allOpt = win.document.createElement('option');
                allOpt.value = '';
                allOpt.textContent = 'All';
                lineageFilter.appendChild(allOpt);

                // Add lineage options
                lineages.forEach(lin => {
                    const opt = win.document.createElement('option');
                    opt.value = lin;
                    opt.textContent = lin;
                    lineageFilter.appendChild(opt);
                });

                result.textContent += `\n\n✅ Successfully populated lineage dropdown with ${lineages.length} options!`;
                lineageFilter.style.border = '3px solid green';

            } catch (e) {
                result.textContent += '\n\nERROR: ' + e.message;
            }
        }, 2000);

    } catch (e) {
        result.textContent = 'ERROR: ' + e.message;
    }
}
</script>
</body>
</html>
