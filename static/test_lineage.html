<!DOCTYPE html>
<html>
<head>
    <title>Lineage Test</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .test { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .pass { background: #d4edda; }
        .fail { background: #f8d7da; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Lineage Database Test</h1>
    <div id="results"></div>

    <script>
        async function runTests() {
            const results = document.getElementById('results');

            // Test 1: Filter Options
            results.innerHTML += '<div class="test"><h2>Test 1: Filter Options API</h2><p>Loading...</p></div>';
            try {
                const resp1 = await fetch('/api/filter-options?refresh=true&nocache=1');
                const data1 = await resp1.json();
                const lineages = data1.lineage || [];
                const pass = lineages.includes('INDICA') && lineages.includes('SATIVA');
                document.querySelectorAll('.test')[0].className = 'test ' + (pass ? 'pass' : 'fail');
                document.querySelectorAll('.test')[0].innerHTML = `
                    <h2>Test 1: Filter Options API</h2>
                    <p><strong>Status:</strong> ${pass ? '✅ PASS' : '❌ FAIL'}</p>
                    <p><strong>Lineages found:</strong> ${lineages.join(', ')}</p>
                    <pre>${JSON.stringify(data1, null, 2)}</pre>
                `;
            } catch (e) {
                document.querySelectorAll('.test')[0].className = 'test fail';
                document.querySelectorAll('.test')[0].innerHTML = `
                    <h2>Test 1: Filter Options API</h2>
                    <p><strong>Status:</strong> ❌ ERROR</p>
                    <p>${e.message}</p>
                `;
            }

            // Test 2: Available Tags (check specific products)
            results.innerHTML += '<div class="test"><h2>Test 2: Product Lineages</h2><p>Loading...</p></div>';
            try {
                const resp2 = await fetch('/api/available-tags?nocache=1&fast_load=0&prefer_db=1');
                const data2 = await resp2.json();
                const tags = data2.tags || [];

                const testProducts = [
                    { name: 'Watermelon Sangria', expected: 'INDICA' },
                    { name: 'Bubble Gum Gelato', expected: 'INDICA' },
                    { name: 'Frosted Gummy', expected: 'SATIVA' }
                ];

                let results2 = '<h2>Test 2: Product Lineages</h2>';
                let allPass = true;

                testProducts.forEach(test => {
                    const tag = tags.find(t => (t['Product Name*'] || '').includes(test.name));
                    if (tag) {
                        const lineage = tag.Lineage || tag.canonical_lineage || tag.currentLineage || 'NONE';
                        const pass = lineage === test.expected;
                        allPass = allPass && pass;
                        results2 += `
                            <p><strong>${test.name}:</strong>
                            Expected: ${test.expected}, Got: ${lineage}
                            ${pass ? '✅' : '❌'}</p>
                        `;
                    } else {
                        results2 += `<p><strong>${test.name}:</strong> Not found in tags ❌</p>`;
                        allPass = false;
                    }
                });

                results2 += `<p><strong>Total tags:</strong> ${tags.length}</p>`;

                document.querySelectorAll('.test')[1].className = 'test ' + (allPass ? 'pass' : 'fail');
                document.querySelectorAll('.test')[1].innerHTML = results2;
            } catch (e) {
                document.querySelectorAll('.test')[1].className = 'test fail';
                document.querySelectorAll('.test')[1].innerHTML = `
                    <h2>Test 2: Product Lineages</h2>
                    <p><strong>Status:</strong> ❌ ERROR</p>
                    <p>${e.message}</p>
                `;
            }
        }

        runTests();
    </script>
</body>
</html>
