[pytest]
# Pytest configuration file
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    api: API endpoint tests
    database: Database tests
    slow: Slow running tests
    requires_db: Tests that require database setup

# Coverage options (if pytest-cov is installed)
# --cov=core
# --cov=src
# --cov-report=html
# --cov-report=term-missing

# Test discovery
norecursedirs = 
    .git
    .venv
    venv
    env
    __pycache__
    *.egg-info
    uploads
    sessions
    logs

# Minimum Python version
minversion = 3.7

# Timeout for tests (if pytest-timeout is installed)
# timeout = 300

