<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Tag Movement Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }
        .test-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .tag-item {
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 8px;
            margin: 4px 0;
            background-color: white;
        }
        .json-matched-tag {
            border: 2px solid #28a745 !important;
            background-color: rgba(40, 167, 69, 0.1) !important;
            border-radius: 8px !important;
        }
        .tag-checkbox {
            margin-right: 8px;
        }
        .move-buttons {
            margin: 20px 0;
        }
        .log-container {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 15px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        .log-entry {
            margin-bottom: 8px;
            padding: 5px;
            border-radius: 3px;
        }
        .log-info { background-color: #d1ecf1; }
        .log-success { background-color: #d4edda; }
        .log-warning { background-color: #fff3cd; }
        .log-error { background-color: #f8d7da; }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>JSON Tag Movement Test</h1>
        <p>This test verifies that JSON matched tags can be properly moved from Available to Selected.</p>
        
        <div class="row">
            <div class="col-md-6">
                <h3>Available Tags</h3>
                <div id="availableTags" class="border rounded p-3" style="height: 400px; overflow-y: auto;">
                    <!-- Available tags will be populated here -->
                </div>
            </div>
            <div class="col-md-6">
                <h3>Selected Tags</h3>
                <div id="selectedTags" class="border rounded p-3" style="height: 400px; overflow-y: auto;">
                    <!-- Selected tags will be populated here -->
                </div>
            </div>
        </div>
        
        <div class="move-buttons text-center">
            <button class="btn btn-primary" onclick="moveToSelected()">Move to Selected →</button>
            <button class="btn btn-secondary" onclick="moveToAvailable()">← Move to Available</button>
            <button class="btn btn-info" onclick="clearSelected()">Clear Selected</button>
        </div>
        
        <div class="log-container">
            <h5>Test Log:</h5>
            <div id="testLog"></div>
        </div>
    </div>

    <script>
        // Test logging function
        function addLog(message, type = 'info') {
            const logContainer = document.getElementById('testLog');
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            logEntry.innerHTML = `<strong>${new Date().toLocaleTimeString()}:</strong> ${message}`;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // Mock TagManager state
        const TagManager = {
            state: {
                tags: [],
                originalTags: [],
                persistentSelectedTags: [],
                selectedTags: new Set()
            },
            
            createTagElement(tag, isForSelectedTags = false) {
                const tagItem = document.createElement('div');
                tagItem.className = 'tag-item d-flex align-items-center';
                
                // Add special styling for JSON matched tags
                if (tag.Source === 'JSON Match') {
                    tagItem.classList.add('json-matched-tag');
                }
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'tag-checkbox';
                checkbox.value = tag['Product Name*'] || tag.ProductName || tag.displayName || tag.Description || 'Unnamed Product';
                checkbox.checked = this.state.persistentSelectedTags.includes(checkbox.value);
                checkbox.addEventListener('change', (e) => this.handleTagSelection(e, tag));
                
                const tagName = document.createElement('span');
                tagName.textContent = tag['Product Name*'] || tag.ProductName || tag.displayName || tag.Description || 'Unnamed Product';
                
                const tagInfo = document.createElement('span');
                tagInfo.className = 'ms-2 text-muted small';
                tagInfo.textContent = `(${tag.Vendor || 'Unknown Vendor'} - ${tag['Product Type*'] || 'Unknown Type'})`;
                
                tagItem.appendChild(checkbox);
                tagItem.appendChild(tagName);
                tagItem.appendChild(tagInfo);
                
                return tagItem;
            },
            
            handleTagSelection(e, tag) {
                const tagName = e.target.value;
                if (e.target.checked) {
                    if (!this.state.persistentSelectedTags.includes(tagName)) {
                        this.state.persistentSelectedTags.push(tagName);
                    }
                } else {
                    const index = this.state.persistentSelectedTags.indexOf(tagName);
                    if (index > -1) {
                        this.state.persistentSelectedTags.splice(index, 1);
                    }
                }
                this.state.selectedTags = new Set(this.state.persistentSelectedTags);
                addLog(`Tag selection changed: ${tagName} (checked: ${e.target.checked})`, 'info');
            },
            
            updateSelectedTags(tags) {
                const container = document.getElementById('selectedTags');
                container.innerHTML = '';
                
                tags.forEach(tag => {
                    const tagElement = this.createTagElement(tag, true);
                    container.appendChild(tagElement);
                });
                
                addLog(`Updated selected tags display with ${tags.length} tags`, 'success');
            },
            
            async moveToSelected() {
                addLog('Starting moveToSelected...', 'info');
                
                // Get checked tags in availableTags
                const checked = Array.from(document.querySelectorAll('#availableTags input[type="checkbox"].tag-checkbox:checked')).map(cb => cb.value);
                if (checked.length === 0) {
                    addLog('No tags selected to move', 'warning');
                    return;
                }
                
                addLog(`Found ${checked.length} checked tags to move`, 'info');
                
                try {
                    // Add tags to persistent selected tags (independent of filters)
                    checked.forEach(tagName => {
                        // Ensure persistentSelectedTags is an array
                        if (!Array.isArray(this.state.persistentSelectedTags)) {
                            this.state.persistentSelectedTags = [];
                        }
                        if (!this.state.persistentSelectedTags.includes(tagName)) {
                            this.state.persistentSelectedTags.push(tagName);
                        }
                    });
                    
                    // Update the regular selectedTags set to match persistent ones
                    this.state.selectedTags = new Set(this.state.persistentSelectedTags);
                    
                    // Get the full tag objects for the selected tags
                    const selectedTagObjects = Array.from(this.state.persistentSelectedTags).map(name =>
                        this.state.tags.find(t => {
                            // Try multiple possible field names for product name
                            const productName = t['Product Name*'] || t.ProductName || t['product_name'] || t.displayName || t.Description;
                            return productName === name;
                        })
                    ).filter(Boolean);
                    
                    // Update the selected tags display
                    this.updateSelectedTags(selectedTagObjects);
                    
                    // Hide selected tags from available tags display for better performance
                    checked.forEach(tagName => {
                        const tagElement = document.querySelector(`#availableTags .tag-checkbox[value="${tagName}"]`);
                        if (tagElement) {
                            const tagItem = tagElement.closest('.tag-item');
                            if (tagItem) {
                                tagItem.style.display = 'none';
                            }
                        }
                    });
                    
                    addLog(`Successfully moved ${checked.length} tags to selected. Total selected: ${this.state.persistentSelectedTags.length}`, 'success');
                } catch (error) {
                    addLog(`Failed to move tags: ${error.message}`, 'error');
                }
            },
            
            async moveToAvailable() {
                addLog('Starting moveToAvailable...', 'info');
                
                // Get checked tags in selectedTags
                const checked = Array.from(document.querySelectorAll('#selectedTags input[type="checkbox"].tag-checkbox:checked')).map(cb => cb.value);
                if (checked.length === 0) {
                    addLog('No tags selected to move back', 'warning');
                    return;
                }
                
                addLog(`Found ${checked.length} checked tags to move back`, 'info');
                
                try {
                    // Remove tags from persistent selected tags
                    checked.forEach(tagName => {
                        // Ensure persistentSelectedTags is an array
                        if (!Array.isArray(this.state.persistentSelectedTags)) {
                            this.state.persistentSelectedTags = [];
                        }
                        const index = this.state.persistentSelectedTags.indexOf(tagName);
                        if (index > -1) {
                            this.state.persistentSelectedTags.splice(index, 1);
                        }
                    });
                    
                    // Update the regular selectedTags set to match persistent ones
                    this.state.selectedTags = new Set(this.state.persistentSelectedTags);
                    
                    // Get the full tag objects for the remaining selected tags
                    const selectedTagObjects = Array.from(this.state.persistentSelectedTags).map(name =>
                        this.state.tags.find(t => {
                            // Try multiple possible field names for product name
                            const productName = t['Product Name*'] || t.ProductName || t['product_name'] || t.displayName || t.Description;
                            return productName === name;
                        })
                    ).filter(Boolean);
                    
                    // Update the selected tags display
                    this.updateSelectedTags(selectedTagObjects);
                    
                    // Show moved back tags in available tags display for better performance
                    checked.forEach(tagName => {
                        const tagElement = document.querySelector(`#availableTags .tag-checkbox[value="${tagName}"]`);
                        if (tagElement) {
                            const tagItem = tagElement.closest('.tag-item');
                            if (tagItem) {
                                tagItem.style.display = 'block';
                            }
                        }
                    });
                    
                    addLog(`Successfully moved ${checked.length} tags back to available. Total selected: ${this.state.persistentSelectedTags.length}`, 'success');
                } catch (error) {
                    addLog(`Failed to move tags back: ${error.message}`, 'error');
                }
            },
            
            async clearSelected() {
                addLog('Clearing all selected tags...', 'info');
                
                this.state.persistentSelectedTags = [];
                this.state.selectedTags = new Set();
                
                // Update the selected tags display
                this.updateSelectedTags([]);
                
                // Show all tags in available tags display
                const availableTagItems = document.querySelectorAll('#availableTags .tag-item');
                availableTagItems.forEach(item => {
                    item.style.display = 'block';
                });
                
                // Uncheck all checkboxes
                const allCheckboxes = document.querySelectorAll('.tag-checkbox');
                allCheckboxes.forEach(cb => {
                    cb.checked = false;
                });
                
                addLog('All selected tags cleared', 'success');
            }
        };

        // Global functions for button clicks
        function moveToSelected() {
            TagManager.moveToSelected();
        }
        
        function moveToAvailable() {
            TagManager.moveToAvailable();
        }
        
        function clearSelected() {
            TagManager.clearSelected();
        }

        // Initialize test data
        function initializeTestData() {
            addLog('Initializing test data...', 'info');
            
            // Create mock JSON matched tags
            const mockJsonTags = [
                {
                    'Product Name*': 'Test Product 1',
                    'ProductName': 'Test Product 1',
                    'displayName': 'Test Product 1',
                    'Description': 'Test Product 1',
                    'Vendor': 'Test Vendor 1',
                    'Product Type*': 'Flower',
                    'Source': 'JSON Match',
                    'Lineage': 'HYBRID',
                    'Weight*': '3.5g',
                    'Price': '$25.00'
                },
                {
                    'Product Name*': 'Test Product 2',
                    'ProductName': 'Test Product 2',
                    'displayName': 'Test Product 2',
                    'Description': 'Test Product 2',
                    'Vendor': 'Test Vendor 2',
                    'Product Type*': 'Concentrate',
                    'Source': 'JSON Match',
                    'Lineage': 'SATIVA',
                    'Weight*': '1g',
                    'Price': '$45.00'
                },
                {
                    'Product Name*': 'Test Product 3',
                    'ProductName': 'Test Product 3',
                    'displayName': 'Test Product 3',
                    'Description': 'Test Product 3',
                    'Vendor': 'Test Vendor 3',
                    'Product Type*': 'Edible',
                    'Source': 'JSON Match',
                    'Lineage': 'INDICA',
                    'Weight*': '100mg',
                    'Price': '$15.00'
                },
                {
                    'Product Name*': 'Regular Excel Product',
                    'ProductName': 'Regular Excel Product',
                    'displayName': 'Regular Excel Product',
                    'Description': 'Regular Excel Product',
                    'Vendor': 'Excel Vendor',
                    'Product Type*': 'Vape Cartridge',
                    'Source': 'Excel Match',
                    'Lineage': 'HYBRID',
                    'Weight*': '0.5g',
                    'Price': '$35.00'
                }
            ];
            
            // Set up TagManager state
            TagManager.state.tags = mockJsonTags;
            TagManager.state.originalTags = mockJsonTags;
            TagManager.state.persistentSelectedTags = [];
            TagManager.state.selectedTags = new Set();
            
            // Populate available tags
            const availableContainer = document.getElementById('availableTags');
            availableContainer.innerHTML = '';
            
            mockJsonTags.forEach(tag => {
                const tagElement = TagManager.createTagElement(tag, false);
                availableContainer.appendChild(tagElement);
            });
            
            addLog(`Initialized with ${mockJsonTags.length} test tags (${mockJsonTags.filter(t => t.Source === 'JSON Match').length} JSON matched)`, 'success');
            addLog('Test ready! Try selecting some tags and moving them between panels.', 'info');
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            initializeTestData();
        });
    </script>
</body>
</html>
