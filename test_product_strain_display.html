<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Strain Display Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #1a1a1a;
            color: white;
        }
        .tag-item {
            display: flex;
            align-items: center;
            padding: 8px;
            margin-bottom: 8px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .tag-info {
            flex-grow: 1;
            display: flex;
            align-items: center;
        }
        .tag-name {
            display: inline-block;
            margin-right: 8px;
            font-weight: bold;
        }
        .strain-info {
            display: inline-block;
            margin-right: 8px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.8);
            font-style: italic;
        }
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
        }
        .test-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <h1>Product Strain Display Test</h1>
    
    <div class="test-section">
        <div class="test-title">Test 1: Tag with Product Strain</div>
        <div class="tag-item">
            <div class="tag-info">
                <div class="tag-name">OG Kush Flower</div>
                <div class="strain-info">(OG Kush)</div>
            </div>
        </div>
    </div>
    
    <div class="test-section">
        <div class="test-title">Test 2: Tag without Product Strain</div>
        <div class="tag-item">
            <div class="tag-info">
                <div class="tag-name">Generic Product</div>
            </div>
        </div>
    </div>
    
    <div class="test-section">
        <div class="test-title">Test 3: Tag with Long Product Strain</div>
        <div class="tag-item">
            <div class="tag-info">
                <div class="tag-name">Blue Dream Concentrate</div>
                <div class="strain-info">(Blue Dream x Haze)</div>
            </div>
        </div>
    </div>
    
    <div class="test-section">
        <div class="test-title">Test 4: Tag with Empty Product Strain</div>
        <div class="tag-item">
            <div class="tag-info">
                <div class="tag-name">Product with Empty Strain</div>
                <div class="strain-info">()</div>
            </div>
        </div>
    </div>
    
    <script>
        // Test the Product Strain display logic
        function testProductStrainDisplay() {
            console.log('Testing Product Strain display...');
            
            const testTags = [
                { 'Product Name*': 'OG Kush Flower', 'Product Strain': 'OG Kush' },
                { 'Product Name*': 'Generic Product', 'Product Strain': '' },
                { 'Product Name*': 'Blue Dream Concentrate', 'Product Strain': 'Blue Dream x Haze' },
                { 'Product Name*': 'Product with Empty Strain', 'Product Strain': '   ' }
            ];
            
            testTags.forEach((tag, index) => {
                const hasStrain = tag['Product Strain'] && tag['Product Strain'].trim();
                console.log(`Tag ${index + 1}: "${tag['Product Name*']}" - Strain: "${tag['Product Strain']}" - Should display: ${hasStrain ? 'YES' : 'NO'}`);
            });
            
            console.log('Product Strain display test completed!');
        }
        
        // Run the test when page loads
        window.addEventListener('load', testProductStrainDisplay);
    </script>
</body>
</html>
